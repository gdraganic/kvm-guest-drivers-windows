name: Balloon test build (scratch)
on:
  push:
    branches: [ci-balloon-1663]
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [fix, base]
        platform: [x64, ARM64, Win32]
        config: [Win11, Win10]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select base commit
        if: matrix.variant == 'base'
        shell: bash
        run: git checkout cc25945690623d944e926f9eadd437251fabcbe9 -- Balloon
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build
        shell: cmd
        working-directory: Balloon
        run: msbuild balloon.sln /m /p:Configuration="${{ matrix.config }} Release" /p:Platform=${{ matrix.platform }} /v:minimal
      - name: Sign
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem -Recurse Balloon/sys -Include balloon.sys,balloon.cat,balloon.inf | ForEach-Object { $_.FullName }
          Get-ChildItem -Recurse Balloon/sys -Include balloon.sys,balloon.cat | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /f build\VirtIOTestCert.pfx $_.FullName
            if ($LASTEXITCODE) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: balloon-${{ matrix.variant }}-${{ matrix.config }}-${{ matrix.platform }}
          path: |
            Balloon/sys/**/balloon.sys
            Balloon/sys/**/balloon.inf
            Balloon/sys/**/balloon.cat
            Balloon/sys/**/balloon.pdb
            build/VirtIOTestCert.cer
