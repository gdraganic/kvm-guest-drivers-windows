name: Balloon MSI-X POC build (scratch)
on:
  push:
    branches: [ci-balloon-msix]
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [msix, msix-pfn]
        platform: [x64, ARM64]
        config: [Win11]
        include:
          - { variant: msix, platform: x64, config: Win10 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add the PFN fix (#1670)
        if: matrix.variant == 'msix-pfn'
        shell: bash
        run: |
          git fetch origin 12d7b4fbacd15caa58bfde0d4ff94213724debfc || git fetch https://github.com/gdraganic/kvm-guest-drivers-windows.git balloon-32bit-pfns
          git -c user.name=ci -c user.email=ci@example.com cherry-pick 12d7b4fbacd15caa58bfde0d4ff94213724debfc
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build
        shell: cmd
        working-directory: Balloon
        run: msbuild balloon.sln /m /p:Configuration="${{ matrix.config }} Release" /p:Platform=${{ matrix.platform }} /v:minimal
      - name: Sign
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem -Recurse Balloon/sys -Include balloon.sys,balloon.cat | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /f build\VirtIOTestCert.pfx $_.FullName
            if ($LASTEXITCODE) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: balloon-${{ matrix.variant }}-${{ matrix.config }}-${{ matrix.platform }}
          path: |
            Balloon/sys/**/balloon.sys
            Balloon/sys/**/balloon.inf
            Balloon/sys/**/balloon.cat
            Balloon/sys/**/balloon.pdb
            build/VirtIOTestCert.cer
